<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>근무 · 휴일 달력</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <button class="nav-btn" id="prev-month" type="button">‹</button>
      <h1 class="date-now">2026년 10월</h1>
      <button class="nav-btn" id="next-month" type="button">›</button>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <section class="summary">
          <div class="stat stat-holiday">
            <h2>휴일</h2>
            <div id="holiday-summary">계산 중...</div>
          </div>
          <div class="stat stat-annual">
            <h2>연차</h2>
            <div id="annual-summary">계산 중...</div>
          </div>
          <div class="stat stat-sick">
            <h2>병가</h2>
            <div id="sick-summary">계산 중...</div>
          </div>
        </section>

        <section class="side-section">
          <div class="section-heading">
            <h2>일정 목록</h2>
            <button id="gcal-login" class="small-button" type="button">
              Google 로그인
            </button>
          </div>

          <p id="gcal-status" class="muted">
            Google Calendar 연결 전입니다.
          </p>

          <div class="event-list-group">
            <h3 class="holiday-heading">휴일 일정</h3>
            <ul id="holiday-list"></ul>
          </div>

          <div class="event-list-group">
            <h3 class="annual-heading">연차 일정</h3>
            <ul id="annual-list"></ul>
          </div>

          <div class="event-list-group">
            <h3 class="sick-heading">병가 일정</h3>
            <ul id="sick-list"></ul>
          </div>

          <div class="event-list-group">
            <h3>일반 일정</h3>
            <ul id="normal-list"></ul>
          </div>
        </section>
      </aside>

      <main class="main">
        <section class="calendar">
          <div class="grid date-title">
            <div>일</div><div>월</div><div>화</div>
            <div>수</div><div>목</div><div>금</div><div>토</div>
          </div>
          <div class="grid date-board"></div>
        </section>
      </main>
    </div>
  </div>

  <dialog id="gcal-dialog">
    <form id="gcal-form">
      <h2 id="dialog-heading">일정 추가</h2>

      <label for="gcal-date">시작일</label>
      <input id="gcal-date" type="date" required>

      <label for="gcal-end-date">종료일</label>
      <input id="gcal-end-date" type="date">

      <label for="gcal-type">종류</label>
      <select id="gcal-type">
        <option value="normal">일반 일정</option>
        <option value="holiday">휴일</option>
        <option value="annual">연차</option>
        <option value="sick">병가</option>
      </select>

      <label for="gcal-title">제목</label>
      <input id="gcal-title" type="text" placeholder="일정 제목">

      <div class="dlg-buttons">
        <button type="submit" id="gcal-save" class="primary-button">저장</button>
        <button type="button" id="gcal-delete" class="danger-button">삭제</button>
        <button type="button" id="gcal-cancel" class="plain-button">닫기</button>
      </div>

      <p id="dialog-message" class="muted"></p>
    </form>
  </dialog>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="holidays.js"></script>
  <script src="gcal.js"></script>
  <script src="index.js"></script>
</body>
</html>
