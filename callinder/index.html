<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Simple Calendar</title>
</head>
<body>
<div class="container">
    <div class="header">
        <button class="nav-btn date-last">&lt;</button>
        <h2 class="date-now"></h2>
        <button class="nav-btn date-next">&gt;</button>
    </div>
    <div class="summary"></div>
    <div class="main">
        <div class="calendar">
            <div class="grid date-title">
                <div>일</div>
                <div>월</div>
                <div>화</div>
                <div>수</div>
                <div>목</div>
                <div>금</div>
                <div>토</div>
            </div>
            <div class="grid date-board"></div>
        </div>
    </div>

    <!-- 아래부터 새로 추가한 부분 -->
    <dialog id="gcal-dialog">
        <h3 id="dlg-date"></h3>
        <input type="text" id="dlg-title" placeholder="일정 제목">
        <select id="dlg-type">
            <option value="normal">일반 일정</option>
            <option value="holiday">휴일</option>
        </select>
        <label>일수 <input type="number" id="dlg-days" value="1" min="1" max="31"></label>
        <div class="dlg-buttons">
            <button type="button" id="dlg-save">저장</button>
            <button type="button" id="dlg-cancel">취소</button>
        </div>
    </dialog>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="holidays.js"></script>
<script src="gcal.js"></script>
<script src="index.js"></script>
</body>
</html>
