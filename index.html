<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Simple Calendar</title>
</head>
<body>
<div class="container">
    <div class="header">
        <button class="nav-btn date-last">&lt;</button>
        <h2 class="date-now"></h2>
        <button class="nav-btn date-next">&gt;</button>
    </div>
    <div class="summary"></div>
    <div class="main">
        <div class="calendar">
            <div class="grid date-title">
                <div>일</div>
                <div>월</div>
                <div>화</div>
                <div>수</div>
                <div>목</div>
                <div>금</div>
                <div>토</div>
            </div>
            <div class="grid date-board"></div>
        </div>
    </div>
</div>
<script src="holidays.js"></script>
<script src="index.js"></script>
</body>
</html>
